CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y

# Убираем фильтрацию и режимы сна
# CONFIG_PMW3610_SMART_ALGORITHM is not set
CONFIG_PMW3610_FORCE_AWAKE=y

# Оставим polling
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Вернули инверсию осей
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n