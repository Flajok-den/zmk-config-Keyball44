# Основные функции
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# Сенсор PMW3610
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200                      # Меньше, чем 3000 для стабильности
CONFIG_PMW3610_CPI_DIVIDOR=1                # Упростим: делитель не нужен при 1200
CONFIG_PMW3610_ORIENTATION_180=y            # 180°, если сенсор установлен "вниз"
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1

# Скроллинг
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n

# Алгоритмы и задержки
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOW
