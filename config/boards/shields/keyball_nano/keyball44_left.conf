# Снимаем инверсии
# CONFIG_PMW3610_INVERT_X
# CONFIG_PMW3610_INVERT_Y
# CONFIG_PMW3610_INVERT_SCROLL_X
# CONFIG_PMW3610_INVERT_SCROLL_Y

CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n